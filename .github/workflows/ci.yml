name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check library
        run: npm run typecheck

      - name: Type check demo
        run: npm run typecheck:demo

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Type check published declarations
        run: npm run typecheck:dist

      - name: Check package contents
        run: npm pack --dry-run

      - name: Build demo
        run: npm run demo:build
